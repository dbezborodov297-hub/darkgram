<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RP Countries</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--card:#1c1c1e;--card-2:#2c2c2e;--line:#38383a;
  --text:#fff;--dim:#98989f;--muted:#636366;
  --accent:#bf5af2;--accent-2:#5e5ce6;
  --green:#30d158;--red:#ff453a;--gold:#ffd60a;--blue:#0a84ff;
  --radius:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.4;padding-bottom:calc(80px + env(safe-area-inset-bottom));letter-spacing:-.3px}
.header{background:rgba(0,0,0,0.75);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-bottom:.5px solid var(--line);position:sticky;top:0;z-index:50;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}
.logo{font-size:17px;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-right{display:flex;gap:8px;align-items:center}
.badge{font-size:13px;font-weight:600;color:var(--accent-2);background:rgba(191,90,242,0.12);border:1px solid rgba(191,90,242,0.25);padding:5px 10px;border-radius:20px}
.container{padding:16px;max-width:540px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;padding:14px 16px 8px}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98);opacity:.85}
.btn.secondary{background:var(--card-2);color:var(--text)}
.btn.small{padding:10px 14px;font-size:14px;margin-bottom:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:.5px solid var(--line);cursor:pointer}
.row:active{background:var(--card-2)}
.row:first-child{border-top:none}
.row-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.row-info{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:12px;color:var(--dim);margin-top:2px}
.row-chev{color:var(--muted);font-size:20px}
.flag{font-size:24px;margin-right:4px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px}
.stat-k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.stat-v{font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-.5px}
.stat-v.gold{color:var(--gold)}
.stat-v.green{color:var(--green)}
.stat-v.blue{color:var(--blue)}
.stat-v.purple{color:var(--accent-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.grid2 .btn{margin-bottom:0;padding:14px 10px;font-size:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:540px;max-height:85vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:slideUp .3s cubic-bezier(0.32,0.72,0,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:.5px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.modal-title{font-size:18px;font-weight:700}
.modal-close{background:var(--card-2);border:none;width:30px;height:30px;border-radius:15px;cursor:pointer;color:var(--text);font-size:16px}
.modal-body{padding:16px 20px}
.building-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:.5px solid var(--line)}
.building-row:last-child{border:none}
.building-info{flex:1}
.building-name{font-size:15px;font-weight:600}
.building-desc{font-size:12px;color:var(--dim);margin-top:2px}
.building-cost{font-size:14px;font-weight:700;color:var(--gold);margin-right:10px}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120%);background:rgba(44,44,46,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:.5px solid var(--line);color:var(--text);padding:12px 20px;border-radius:14px;font-size:14px;font-weight:500;z-index:999;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:rgba(255,69,58,0.96)}
.toast.success{background:rgba(48,209,88,0.96)}
.confirm{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.confirm.open{display:flex;animation:fadeIn .2s}
.confirm-box{background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center}
.confirm-title{font-size:17px;font-weight:700;margin-bottom:8px}
.confirm-text{font-size:14px;color:var(--dim);margin-bottom:18px}
.confirm-btns{display:flex;gap:10px}
.confirm-btns .btn{margin:0}
.loader{width:20px;height:20px;border:2px solid var(--card-2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:6px;background:var(--card-2);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(20,20,22,0.85);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-top:.5px solid var(--line);display:flex;padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:100;max-width:540px;margin:0 auto}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);cursor:pointer;font-size:10px;font-weight:500}
.tab-item.active{color:var(--accent-2)}
.tab-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div class="header">
  <div class="logo">🏛️ RP Countries</div>
  <div class="header-right">
    <div class="badge" id="headerBadge">—</div>
  </div>
</div>

<div class="container" id="app">
  <div class="loader" style="margin-top:80px"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">—</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="confirm" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">Подтверждение</div>
    <div class="confirm-text" id="confirmText">Вы уверены?</div>
    <div class="confirm-btns">
      <button class="btn secondary" onclick="cancelConfirm()">Отмена</button>
      <button class="btn" id="confirmOk">ОК</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const STORAGE_KEY = 'rp_countries_v1';

// ============================================================
// ДАННЫЕ (в localStorage, чтобы работало без сервера)
// ============================================================
const COUNTRIES_25 = [
  {name:'Россия', flag:'🇷🇺', pop:146000000, treas:50000, army:1000000, tech:5},
  {name:'США', flag:'🇺🇸', pop:330000000, treas:80000, army:1500000, tech:7},
  {name:'Китай', flag:'🇨🇳', pop:1400000000, treas:70000, army:2000000, tech:6},
  {name:'Германия', flag:'🇩🇪', pop:83000000, treas:60000, army:300000, tech:6},
  {name:'Франция', flag:'🇫🇷', pop:67000000, treas:55000, army:350000, tech:6},
  {name:'Великобритания', flag:'🇬🇧', pop:67000000, treas:58000, army:300000, tech:6},
  {name:'Япония', flag:'🇯🇵', pop:125000000, treas:65000, army:250000, tech:7},
  {name:'Индия', flag:'🇮🇳', pop:1380000000, treas:40000, army:1400000, tech:4},
  {name:'Бразилия', flag:'🇧🇷', pop:213000000, treas:35000, army:400000, tech:4},
  {name:'Канада', flag:'🇨🇦', pop:38000000, treas:50000, army:150000, tech:6},
  {name:'Италия', flag:'🇮🇹', pop:60000000, treas:48000, army:200000, tech:5},
  {name:'Испания', flag:'🇪🇸', pop:47000000, treas:40000, army:150000, tech:5},
  {name:'Турция', flag:'🇹🇷', pop:84000000, treas:30000, army:500000, tech:4},
  {name:'Южная Корея', flag:'🇰🇷', pop:51000000, treas:55000, army:600000, tech:7},
  {name:'Иран', flag:'🇮🇷', pop:85000000, treas:30000, army:600000, tech:4},
  {name:'Польша', flag:'🇵🇱', pop:38000000, treas:35000, army:200000, tech:5},
  {name:'Украина', flag:'🇺🇦', pop:44000000, treas:25000, army:300000, tech:4},
  {name:'Саудовская Аравия', flag:'🇸🇦', pop:34000000, treas:70000, army:200000, tech:5},
  {name:'Австралия', flag:'🇦🇺', pop:26000000, treas:45000, army:100000, tech:6},
  {name:'Мексика', flag:'🇲🇽', pop:129000000, treas:25000, army:250000, tech:3},
  {name:'Индонезия', flag:'🇮🇩', pop:274000000, treas:22000, army:400000, tech:3},
  {name:'Нигерия', flag:'🇳🇬', pop:206000000, treas:15000, army:200000, tech:2},
  {name:'Египет', flag:'🇪🇬', pop:104000000, treas:20000, army:450000, tech:3},
  {name:'ЮАР', flag:'🇿🇦', pop:59000000, treas:25000, army:100000, tech:4},
  {name:'Аргентина', flag:'🇦🇷', pop:45000000, treas:28000, army:150000, tech:4},
];

const BUILDINGS = {
  farm:     {name:'🌾 Ферма',      cost:200, desc:'+500 еды/час'},
  factory:  {name:'🏭 Завод',      cost:500, desc:'+300 💰/час'},
  barracks: {name:'⚔️ Казармы',    cost:300, desc:'+200 армии/час'},
  school:   {name:'🎓 Школа',      cost:400, desc:'+1 технология/час'},
  hospital: {name:'🏥 Больница',   cost:350, desc:'+2 стабильности/час'},
  police:   {name:'🚔 Полиция',    cost:250, desc:'+3 стабильности/час'},
  mine:     {name:'⛏️ Шахта',      cost:400, desc:'+300 металла/час'},
  oilrig:   {name:'🛢️ Нефтевышка', cost:600, desc:'+200 нефти/час'},
};

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let state = null;

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) state = JSON.parse(s);
  } catch(e) {}
  if (!state) {
    state = {
      countries: COUNTRIES_25.map((c, i) => ({
        id: i,
        ...c,
        owner: null,
        stability: 70,
        food: 5000,
        metal: 2000,
        oil: 1000,
        cities: [],
        isNpc: true,
      })),
      myCountryId: null,
      news: [],
      lastTick: Date.now(),
    };
  }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

// ============================================================
// ЭКОНОМИКА (тик раз в секунду)
// ============================================================
function cityIncomePerHour(city) {
  let inc = city.pop * 0.0005 * 3600 + 50; // базовый налог + базовая доходность
  if (city.buildings) {
    for (const [k, cnt] of Object.entries(city.buildings)) {
      if (k === 'factory') inc += 300 * cnt;
    }
  }
  return inc;
}

function countryIncomePerHour(country) {
  let total = 0;
  for (const city of country.cities) total += cityIncomePerHour(city);
  return total;
}

function tick() {
  const now = Date.now();
  const dt = (now - state.lastTick) / 1000; // секунд прошло
  if (dt < 1) return;
  state.lastTick = now;

  for (const country of state.countries) {
    // Доход с городов
    const incomePerHour = countryIncomePerHour(country);
    const incomePerSec = incomePerHour / 3600;

    // Расход на армию
    const expensePerSec = country.army * 0.5 / 3600;

    country.treas += (incomePerSec - expensePerSec) * dt;
    if (country.treas < 0) country.treas = 0;

    // Стабильность восстанавливается
    if (country.stability < 100) country.stability = Math.min(100, country.stability + 0.001 * dt);

    // Рост населения от еды
    if (country.food > country.pop / 1000) {
      const growth = (country.food * 0.001) * (country.stability / 100) * dt;
      country.pop += growth;
      country.food -= growth * 10;
    }

    // Доход от зданий в ресурсах
    for (const city of country.cities) {
      if (!city.buildings) continue;
      for (const [k, cnt] of Object.entries(city.buildings)) {
        if (k === 'farm') country.food += (500 / 3600) * cnt * dt;
        else if (k === 'mine') country.metal += (300 / 3600) * cnt * dt;
        else if (k === 'oilrig') country.oil += (200 / 3600) * cnt * dt;
        else if (k === 'barracks') country.army += (200 / 3600) * cnt * dt;
        else if (k === 'school') country.tech += (1 / 3600) * cnt * dt;
        else if (k === 'hospital') country.stability += (2 / 3600) * cnt * dt;
        else if (k === 'police') country.stability += (3 / 3600) * cnt * dt;
      }
    }
    country.stability = Math.max(0, Math.min(100, country.stability));
  }

  // NPC действия — раз в 5 минут реального времени
  if (Math.floor(now / 300000) !== Math.floor((now - dt * 1000) / 300000)) {
    npcTick();
  }

  saveState();
}

function npcTick() {
  for (const country of state.countries) {
    if (!country.isNpc) continue;
    if (country.treas < 500) continue;
    if (Math.random() < 0.3) {
      const bkey = ['farm', 'factory', 'barracks', 'police'][Math.floor(Math.random() * 4)];
      const cost = BUILDINGS[bkey].cost;
      if (country.treas >= cost && country.cities.length > 0) {
        country.treas -= cost;
        const city = country.cities[0];
        if (!city.buildings) city.buildings = {};
        city.buildings[bkey] = (city.buildings[bkey] || 0) + 1;
        addNews(`${country.flag} ${country.name}: построено ${BUILDINGS[bkey].name}`);
      }
    }
  }
}

function addNews(text) {
  state.news.unshift({time: Date.now(), text});
  if (state.news.length > 50) state.news = state.news.slice(0, 50);
}

setInterval(tick, 1000);

// ============================================================
// UI
// ============================================================
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

function fmt(n) {
  if (n >= 1000000000) return (n / 1000000000).toFixed(1) + ' млрд';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + ' млн';
  if (n >= 1000) return (n / 1000).toFixed(1) + ' тыс';
  return Math.floor(n).toString();
}

function render() {
  const app = document.getElementById('app');
  const myCountry = state.myCountryId !== null
    ? state.countries.find(c => c.id === state.myCountryId)
    : null;

  // Badge
  const badge = document.getElementById('headerBadge');
  if (myCountry) {
    badge.textContent = `${myCountry.flag} ${fmt(myCountry.treas)}💰`;
  } else {
    badge.textContent = '🌍 Выбор страны';
  }

  if (!myCountry) {
    renderChooseCountry();
  } else {
    renderMain(myCountry);
  }
}

function renderChooseCountry() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div style="text-align:center;padding:30px 0 20px">
      <div style="font-size:64px;margin-bottom:10px">🏛️</div>
      <div style="font-size:22px;font-weight:700;margin-bottom:6px">Выбери страну</div>
      <div style="font-size:14px;color:var(--dim)">⚠️ Выбор — навсегда!</div>
    </div>
    <div class="card">
      ${state.countries.map(c => `
        <div class="row" onclick="tryTake(${c.id})">
          <div class="row-icon">${c.flag}</div>
          <div class="row-info">
            <div class="row-title">${c.name}</div>
            <div class="row-sub">${fmt(c.pop)} чел · ${fmt(c.treas)}💰 · ${fmt(c.army)}⚔️</div>
          </div>
          <div class="row-chev">${c.owner ? '🔒' : '›'}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderMain(country) {
  const app = document.getElementById('app');
  const incomeHour = countryIncomePerHour(country);
  const cities = country.cities;

  app.innerHTML = `
    <div class="card" style="background:linear-gradient(135deg,rgba(191,90,242,0.15),rgba(94,92,230,0.05));border:1px solid rgba(191,90,242,0.25)">
      <div style="padding:18px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
          <div style="font-size:42px">${country.flag}</div>
          <div>
            <div style="font-size:20px;font-weight:700">${country.name}</div>
            <div style="font-size:12px;color:var(--dim);margin-top:2px">Твоя страна</div>
          </div>
        </div>
        <div style="font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:600">Казна</div>
        <div style="font-size:34px;font-weight:800;color:var(--gold);letter-spacing:-1px;line-height:1.1;margin-top:4px">${fmt(country.treas)} 💰</div>
        <div style="font-size:13px;color:var(--green);margin-top:6px">+${fmt(incomeHour)} 💰/час · +${(incomeHour/3600).toFixed(2)}/сек</div>
      </div>
    </div>

    <div class="grid2">
      <div class="stat"><div class="stat-k">👥 Население</div><div class="stat-v">${fmt(country.pop)}</div></div>
      <div class="stat"><div class="stat-k">⚔️ Армия</div><div class="stat-v">${fmt(country.army)}</div></div>
      <div class="stat"><div class="stat-k">🔬 Технологии</div><div class="stat-v purple">${Math.floor(country.tech)}</div></div>
      <div class="stat"><div class="stat-k">📊 Стабильность</div><div class="stat-v green">${Math.floor(country.stability)}%</div></div>
      <div class="stat"><div class="stat-k">🌾 Еда</div><div class="stat-v">${fmt(country.food)}</div></div>
      <div class="stat"><div class="stat-k">⛏️ Металл</div><div class="stat-v">${fmt(country.metal)}</div></div>
      <div class="stat"><div class="stat-k">🛢️ Нефть</div><div class="stat-v">${fmt(country.oil)}</div></div>
      <div class="stat"><div class="stat-k">🏙️ Города</div><div class="stat-v blue">${cities.length}</div></div>
    </div>

    <div class="card-title">Действия</div>
    <button class="btn" onclick="openBuildings()">🏗️ Строительство</button>
    <button class="btn secondary" onclick="openCities()">🏙️ Города (${cities.length})</button>
    <button class="btn secondary" onclick="openNews()">📰 Новости мира</button>
    <button class="btn secondary" onclick="openTop()">🏆 Топ стран</button>
    <button class="btn secondary" onclick="openAllCountries()">🌍 Все страны</button>
    <button class="btn secondary" onclick="openHelp()">❓ Помощь</button>
  `;
}

// ============================================================
// ДЕЙСТВИЯ
// ============================================================
function tryTake(cid) {
  const c = state.countries.find(x => x.id === cid);
  if (!c) return;
  if (c.owner) { toast('🔒 Занята', 'error'); return; }
  if (state.myCountryId !== null) { toast('У тебя уже есть страна', 'error'); return; }

  showConfirm(
    `Выбрать ${c.flag} ${c.name}?`,
    'Страну нельзя будет поменять!',
    () => {
      c.owner = tg?.initDataUnsafe?.user?.id || 'me';
      c.isNpc = false;
      c.cities.push({ name: 'Столица', pop: 500000, buildings: {} });
      state.myCountryId = cid;
      addNews(`${c.flag} ${c.name}: новый правитель!`);
      saveState();
      toast('✅ Страна твоя!', 'success');
      render();
    }
  );
}

function openBuildings() {
  const c = state.countries.find(x => x.id === state.myCountryId);
  if (!c.cities.length) { toast('Нет городов', 'error'); return; }
  const city = c.cities[0];
  openModal('🏗️ Строительство', `
    <div style="font-size:13px;color:var(--dim);margin-bottom:12px">Город: <b style="color:var(--text)">${city.name}</b></div>
    <div style="font-size:13px;color:var(--dim);margin-bottom:12px">Казна: <b style="color:var(--gold)">${fmt(c.treas)}💰</b></div>
    ${Object.entries(BUILDINGS).map(([k, b]) => `
      <div class="building-row">
        <div class="building-info">
          <div class="building-name">${b.name}</div>
          <div class="building-desc">${b.desc}</div>
        </div>
        <div class="building-cost">${b.cost}💰</div>
        <button class="btn small" onclick="buildInCity(0, '${k}')" ${c.treas < b.cost ? 'disabled' : ''}>+</button>
      </div>
    `).join('')}
  `);
}

function buildInCity(cityIdx, bkey) {
  const c = state.countries.find(x => x.id === state.myCountryId);
  const city = c.cities[cityIdx];
  const b = BUILDINGS[bkey];
  if (c.treas < b.cost) { toast('Не хватает денег', 'error'); return; }
  c.treas -= b.cost;
  if (!city.buildings) city.buildings = {};
  city.buildings[bkey] = (city.buildings[bkey] || 0) + 1;
  addNews(`${c.flag} ${c.name}: построено ${b.name}`);
  saveState();
  toast(`✅ ${b.name}`, 'success');
  openBuildings();
  render();
}

function openCities() {
  const c = state.countries.find(x => x.id === state.myCountryId);
  openModal('🏙️ Города', `
    ${c.cities.length === 0 ? '<div class="empty">Пока нет городов</div>' : ''}
    ${c.cities.map((city, i) => `
      <div class="row" onclick="openCity(${i})">
        <div class="row-icon">🏙️</div>
        <div class="row-info">
          <div class="row-title">${city.name}</div>
          <div class="row-sub">${fmt(city.pop)} чел · ${fmt(cityIncomePerHour(city))}💰/час</div>
        </div>
        <div class="row-chev">›</div>
      </div>
    `).join('')}
    <button class="btn" style="margin-top:14px" onclick="foundCity()">➕ Основать город (5000💰)</button>
  `);
}

function openCity(idx) {
  const c = state.countries.find(x => x.id === state.myCountryId);
  const city = c.cities[idx];
  const buildings = city.buildings || {};
  const rows = Object.entries(buildings).map(([k, cnt]) => 
    `<div class="building-row"><div class="building-info"><div class="building-name">${BUILDINGS[k].name}</div></div><div style="font-weight:700">×${cnt}</div></div>`
  ).join('');
  openModal(`🏙️ ${city.name}`, `
    <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:.5px solid var(--line)">
      <span style="color:var(--dim)">Население</span>
      <b>${fmt(city.pop)}</b>
    </div>
    <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:.5px solid var(--line)">
      <span style="color:var(--dim)">Доход</span>
      <b style="color:var(--gold)">${fmt(cityIncomePerHour(city))}💰/час</b>
    </div>
    <div class="card-title">Здания</div>
    ${rows || '<div class="empty">Пока пусто</div>'}
    <button class="btn" style="margin-top:14px" onclick="closeModal();openBuildings()">🏗️ Построить</button>
  `);
}

function foundCity() {
  const c = state.countries.find(x => x.id === state.myCountryId);
  const cost = 5000;
  if (c.treas < cost) { toast(`Нужно ${cost}💰`, 'error'); return; }
  c.treas -= cost;
  const name = prompt('Название города:', `Город-${c.cities.length + 1}`) || `Город-${c.cities.length + 1}`;
  c.cities.push({ name: name.slice(0, 20), pop: 100000, buildings: {} });
  addNews(`${c.flag} ${c.name}: основан ${name}`);
  saveState();
  toast('✅ Город основан', 'success');
  openCities();
  render();
}

function openNews() {
  openModal('📰 Новости мира', state.news.length === 0
    ? '<div class="empty">Пока пусто</div>'
    : state.news.slice(0, 20).map(n => `<div style="padding:10px 0;border-bottom:.5px solid var(--line);font-size:14px">${n.text}</div>`).join('')
  );
}

function openTop() {
  const sorted = [...state.countries].sort((a, b) => b.treas - a.treas).slice(0, 10);
  openModal('🏆 Топ стран', sorted.map((c, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
    return `<div class="row"><div style="width:34px;text-align:center;font-weight:700">${medal}</div><div class="row-info"><div class="row-title">${c.flag} ${c.name}</div><div class="row-sub">${fmt(c.pop)} чел · ${fmt(c.army)}⚔️</div></div><div style="font-weight:700;color:var(--gold)">${fmt(c.treas)}💰</div></div>`;
  }).join(''));
}

function openAllCountries() {
  openModal('🌍 Все страны', state.countries.map(c => 
    `<div class="row"><div class="row-icon">${c.flag}</div><div class="row-info"><div class="row-title">${c.name}</div><div class="row-sub">${c.owner ? '👤 Занята' : '🟢 Свободна'}</div></div></div>`
  ).join(''));
}

function openHelp() {
  openModal('❓ Помощь', `
    <div style="font-size:14px;line-height:1.6">
      <p style="margin-bottom:14px"><b>🎯 Цель:</b> развивай страну — экономика, армия, города.</p>
      <p style="margin-bottom:14px"><b>💡 Экономика:</b><br>• Каждый город приносит доход сам<br>• Доход = налоги + здания<br>• Тикает каждую секунду</p>
      <p style="margin-bottom:14px"><b>🏗️ Здания:</b><br>Ферма → еда<br>Завод → деньги<br>Казармы → армия<br>Школа → технологии<br>Больница/Полиция → стабильность<br>Шахта → металл<br>Нефтевышка → нефть</p>
      <p><b>🏙️ Города:</b> основывай новые за 5000💰</p>
    </div>
  `);
}

// ============================================================
// МОДАЛКА
// ============================================================
function openModal(title, body) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

// ============================================================
// CONFIRM
// ============================================================
let confirmCb = null;

function showConfirm(title, text, cb) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmOverlay').classList.add('open');
  confirmCb = cb;
}

function cancelConfirm() {
  document.getElementById('confirmOverlay').classList.remove('open');
  confirmCb = null;
}

document.getElementById('confirmOk').onclick = () => {
  if (confirmCb) confirmCb();
  cancelConfirm();
};

// ============================================================
// СТАРТ
// ============================================================
loadState();
render();
setInterval(render, 2000); // обновление UI раз в 2 сек
</script>
</body>
</html>
