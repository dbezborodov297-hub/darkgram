<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Darkgram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0e14;
--bg-2:#0f141c;
--card:#141a24;
--card-2:#1a2130;
--line:#232c3a;
--line-2:#2d3849;
--accent:#4d8fd6;
--accent-2:#6ba6e3;
--text:#ffffff;
--text-dim:#8b9aab;
--muted:#5a6b7d;
}
html,body{height:100%;overflow-x:hidden}
body{
font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
background:radial-gradient(ellipse at top, #131a26 0%, #0a0e14 60%);
background-attachment:fixed;
color:var(--text);
-webkit-font-smoothing:antialiased;
font-size:15px;line-height:1.45;
padding-bottom:50px;min-height:100vh;
}

.header{
background:rgba(20,26,36,0.7);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-bottom:1px solid var(--line);
position:sticky;top:0;z-index:50;
}
.header-inner{
max-width:860px;margin:0 auto;
padding:14px 18px;
display:flex;justify-content:space-between;align-items:center;
}
.logo{font-size:20px;font-weight:700;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:2px}

.tabs{
display:flex;max-width:860px;margin:0 auto;
padding:0 12px;
background:rgba(20,26,36,0.7);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-bottom:1px solid var(--line);
position:sticky;top:63px;z-index:49;
overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
flex-shrink:0;padding:14px 18px;
font-size:13px;font-weight:600;
color:var(--muted);cursor:pointer;
border-bottom:2px solid transparent;
background:transparent;border-top:none;border-left:none;border-right:none;
font-family:inherit;white-space:nowrap;
transition:all .2s;
}
.tab.active{color:var(--accent-2);border-bottom-color:var(--accent-2)}
.tab.hidden{display:none}

.container{max-width:860px;margin:0 auto;padding:18px}
.page{display:none}
.page.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* PROFILE CARD */
.profile-card{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
padding:28px 22px;
text-align:center;
margin-bottom:16px;
}
.avatar-wrap{
width:110px;height:110px;
margin:0 auto 18px;
position:relative;
}
.avatar{
width:110px;height:110px;
border-radius:50%;
background:linear-gradient(135deg,var(--accent),var(--accent-2));
display:flex;align-items:center;justify-content:center;
font-size:44px;font-weight:700;color:#fff;
overflow:hidden;
border:3px solid var(--card-2);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-name{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.profile-username{font-size:14px;color:var(--accent-2);font-weight:600;margin-bottom:14px}
.profile-id{
display:inline-block;
font-size:12px;
color:var(--muted);
background:var(--card-2);
border:1px solid var(--line-2);
padding:6px 14px;
border-radius:10px;
font-family:monospace;
}

/* INFO CARD */
.info-card{
background:var(--card);
border:1px solid var(--line);
border-radius:16px;
padding:20px;
margin-bottom:16px;
}
.card-title{
font-size:13px;
font-weight:700;
color:var(--muted);
text-transform:uppercase;
letter-spacing:1.5px;
margin-bottom:14px;
display:flex;
align-items:center;
gap:8px;
}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{
display:block;
font-size:11px;
font-weight:700;
color:var(--muted);
text-transform:uppercase;
letter-spacing:1.2px;
margin-bottom:8px;
}
.field input,
.field textarea{
width:100%;
background:var(--bg);
border:1px solid var(--line-2);
border-radius:12px;
padding:13px 15px;
color:var(--text);
font-size:15px;
font-family:inherit;
transition:border-color .15s;
resize:none;
}
.field textarea{min-height:90px;line-height:1.4}
.field input:focus,
.field textarea:focus{outline:none;border-color:var(--accent)}
.field input::placeholder,
.field textarea::placeholder{color:var(--muted)}

/* BUTTONS — плоские, без свечения */
.btn{
width:100%;
background:var(--accent);
color:#fff;
border:none;
border-radius:12px;
padding:14px;
font-size:15px;
font-weight:700;
cursor:pointer;
font-family:inherit;
transition:background .15s;
letter-spacing:.2px;
margin-top:4px;
}
.btn:hover{background:var(--accent-2)}
.btn:active{background:#3d7bc2}
.btn:disabled{background:var(--card-2);color:var(--muted);cursor:not-allowed}

/* UPLOAD */
.upload{
border:2px dashed var(--line-2);
border-radius:14px;
padding:24px 16px;
text-align:center;
cursor:pointer;
background:var(--bg);
position:relative;
overflow:hidden;
transition:border-color .2s;
}
.upload:active{border-color:var(--accent)}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-icon{font-size:32px;color:var(--muted);margin-bottom:8px;display:block}
.upload-text{font-size:13px;color:var(--muted);font-weight:600}
.upload-preview{
max-width:100%;max-height:280px;
border-radius:12px;
display:block;
margin:0 auto;
}

.toast{
position:fixed;bottom:24px;left:50%;
transform:translateX(-50%) translateY(120%);
background:var(--card-2);
border:1px solid var(--line-2);
color:var(--text);
padding:14px 22px;
border-radius:14px;
font-size:14px;
font-weight:600;
z-index:99999;
opacity:0;
transition:all .25s;
pointer-events:none;
max-width:90vw;
text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{
text-align:center;
padding:60px 24px;
color:var(--muted);
}
.empty-box{
width:72px;height:72px;
margin:0 auto 18px;
border:2px solid var(--line);
border-radius:20px;
display:flex;align-items:center;justify-content:center;
font-size:26px;color:var(--muted);
background:var(--card);
}
.empty-title{font-size:16px;font-weight:700;color:var(--text-dim);margin-bottom:6px}
.empty-desc{font-size:13px}

.loading{
text-align:center;
padding:60px 20px;
color:var(--muted);
font-size:12px;
font-weight:700;
letter-spacing:2px;
text-transform:uppercase;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="logo">Darkgram</div>
      <div class="logo-sub">profile</div>
    </div>
  </div>
</div>

<div class="tabs" id="tabsBar">
  <button class="tab active" onclick="switchTab('profile', event)">Профиль</button>
  <button class="tab hidden" id="postTab" onclick="switchTab('post', event)">Создать пост</button>
</div>

<div class="container">
  <div class="page active" id="page-profile"><div id="profileContent"><div class="loading">Загрузка...</div></div></div>
  <div class="page" id="page-post"><div id="postContent"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const urlParams = new URLSearchParams(window.location.search);
const TG_USER_ID = urlParams.get('user_id') || tg?.initDataUnsafe?.user?.id || null;
const TG_FIRST_NAME = tg?.initDataUnsafe?.user?.first_name || 'Аноним';
const TG_PHOTO_URL = tg?.initDataUnsafe?.user?.photo_url || '';

let isAdmin = false;
let postMediaData = null;
let postMediaType = '';

async function api(url, opts = {}) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 20000);
    const r = await fetch(url, {
      headers: {'Content-Type':'application/json'},
      signal: c.signal,
      ...opts
    });
    clearTimeout(t);
    return await r.json();
  } catch (e) { return null; }
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchTab(name, event) {
  if (event) event.preventDefault();
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const tabs = ['profile','post'];
  const idx = tabs.indexOf(name);
  const els = document.querySelectorAll('.tab');
  if (idx >= 0 && els[idx]) els[idx].classList.add('active');
  const pg = document.getElementById('page-' + name);
  if (pg) pg.classList.add('active');
  if (name === 'profile') loadProfile();
  if (name === 'post') loadPost();
}

async function loadProfile() {
  const el = document.getElementById('profileContent');
  if (!el) return;
  if (!TG_USER_ID) {
    el.innerHTML = '<div class="empty"><div class="empty-box">?</div><div class="empty-title">Открой из Telegram</div></div>';
    return;
  }
  const data = await api('/api/profile/' + TG_USER_ID) || {};

  const initials = (data.first_name || 'A')[0].toUpperCase();
  const avatarHTML = TG_PHOTO_URL
    ? `<img src="${esc(TG_PHOTO_URL)}" alt="" onerror="this.parentNode.innerHTML='${esc(initials)}'">`
    : esc(initials);
  const usernameText = data.username ? '@' + data.username : 'без @username';

  el.innerHTML = `
    <div class="profile-card">
      <div class="avatar-wrap">
        <div class="avatar">${avatarHTML}</div>
      </div>
      <div class="profile-name">${esc(data.first_name || TG_FIRST_NAME)}</div>
      <div class="profile-username">${esc(usernameText)}</div>
      <div class="profile-id">ID: ${esc(TG_USER_ID)}</div>
    </div>

    <div class="info-card">
      <div class="card-title">О себе</div>
      <div class="field">
        <textarea id="bioInput" placeholder="Расскажи о себе..." maxlength="500">${esc(data.bio || '')}</textarea>
      </div>
    </div>

    <div class="info-card">
      <div class="card-title">Номер телефона</div>
      <div class="field">
        <input type="tel" id="phoneInput" placeholder="+7 (900) 000-00-00" value="${esc(data.phone || '')}" maxlength="30">
      </div>
    </div>

    <div class="info-card">
      <button class="btn" onclick="saveProfile()">Сохранить</button>
    </div>
  `;
}

async function saveProfile() {
  if (!TG_USER_ID) return;
  const bio = document.getElementById('bioInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  const res = await api('/api/profile/save', {
    method: 'POST',
    body: JSON.stringify({ user_id: TG_USER_ID, bio, phone })
  });
  if (res && res.ok) showToast('Сохранено!');
  else showToast('Ошибка');
}

async function loadPost() {
  const el = document.getElementById('postContent');
  if (!el) return;
  if (!isAdmin) {
    el.innerHTML = '<div class="empty"><div class="empty-box">🔒</div><div class="empty-title">Только для админа</div></div>';
    return;
  }

  el.innerHTML = `
    <div class="info-card">
      <div class="card-title">Текст поста</div>
      <div class="field">
        <textarea id="postText" placeholder="Напиши текст поста..." maxlength="1000"></textarea>
      </div>
    </div>

    <div class="info-card">
      <div class="card-title">Фото или видео</div>
      <div class="upload" id="uploadZone">
        <input type="file" id="postFileInput" accept="image/*,video/*">
        <div id="postUploadPlaceholder">
          <span class="upload-icon">+</span>
          <div class="upload-text">Нажми, чтобы выбрать фото или видео</div>
        </div>
        <img id="postPreview" class="upload-preview" style="display:none">
        <video id="postVideoPreview" class="upload-preview" style="display:none" controls></video>
      </div>
    </div>

    <div class="info-card">
      <button class="btn" onclick="publishPost()">Опубликовать во все чаты</button>
    </div>
  `;

  postMediaData = null;
  postMediaType = '';
  const fi = document.getElementById('postFileInput');
  if (fi) {
    fi.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Проверка размера — Telegram принимает до 50 МБ для видео
      if (file.size > 50 * 1024 * 1024) {
        showToast('Файл больше 50 МБ');
        return;
      }

      const isVideo = file.type.startsWith('video/');
      const isImage = file.type.startsWith('image/');

      const reader = new FileReader();
      reader.onload = (ev) => {
        postMediaData = ev.target.result;
        postMediaType = isVideo ? 'video' : (isImage ? 'photo' : '');

        const imgPreview = document.getElementById('postPreview');
        const vidPreview = document.getElementById('postVideoPreview');
        const ph = document.getElementById('postUploadPlaceholder');

        if (isVideo) {
          imgPreview.style.display = 'none';
          vidPreview.src = postMediaData;
          vidPreview.style.display = 'block';
        } else if (isImage) {
          vidPreview.style.display = 'none';
          imgPreview.src = postMediaData;
          imgPreview.style.display = 'block';
        }
        if (ph) ph.style.display = 'none';
      };
      reader.readAsDataURL(file);
    });
  }
}

async function publishPost() {
  if (!TG_USER_ID) return;
  const text = document.getElementById('postText').value.trim();
  if (!text && !postMediaData) {
    showToast('Напиши текст или добавь медиа');
    return;
  }
  if (!confirm('Опубликовать во все группы и всем юзерам?')) return;
  showToast('Отправляю...');
  const res = await api('/api/post/create', {
    method: 'POST',
    body: JSON.stringify({
      user_id: TG_USER_ID,
      text: text,
      media: postMediaData || '',
      media_type: postMediaType
    })
  });
  if (res && res.ok) {
    showToast('Опубликовано!');
    document.getElementById('postText').value = '';
    postMediaData = null;
    postMediaType = '';
    const imgPreview = document.getElementById('postPreview');
    const vidPreview = document.getElementById('postVideoPreview');
    const ph = document.getElementById('postUploadPlaceholder');
    if (imgPreview) { imgPreview.style.display = 'none'; imgPreview.src = ''; }
    if (vidPreview) { vidPreview.style.display = 'none'; vidPreview.src = ''; }
    if (ph) ph.style.display = 'block';
    const fi = document.getElementById('postFileInput');
    if (fi) fi.value = '';
  } else {
    showToast('Ошибка');
  }
}

async function checkAdmin() {
  if (!TG_USER_ID) return;
  const res = await api('/api/is_admin/' + TG_USER_ID) || {};
  isAdmin = !!res.is_admin;
  const tab = document.getElementById('postTab');
  if (isAdmin && tab) tab.classList.remove('hidden');
}

async function init() {
  await checkAdmin();
  await loadProfile();
}

init();
</script>
</body>
</html>
