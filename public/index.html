<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Darkgram Verify</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0e14;
--bg-2:#0f141c;
--card:#141a24;
--card-2:#1a2130;
--line:#232c3a;
--line-2:#2d3849;
--accent:#4d8fd6;
--accent-2:#6ba6e3;
--text:#ffffff;
--text-dim:#8b9aab;
--muted:#5a6b7d;
--green:#4dcd5e;
--gold:#e8b64c;
--red:#e0455a;
}
html,body{height:100%;overflow-x:hidden}
body{
font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
background:radial-gradient(ellipse at top, #131a26 0%, #0a0e14 60%);
background-attachment:fixed;
color:var(--text);
-webkit-font-smoothing:antialiased;
font-size:15px;line-height:1.45;
padding-bottom:60px;min-height:100vh;
}
.header{
background:rgba(20,26,36,0.9);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-bottom:1px solid var(--line);
position:sticky;top:0;z-index:50;
}
.header-inner{
max-width:860px;margin:0 auto;
padding:14px 18px;
display:flex;justify-content:space-between;align-items:center;
}
.logo{font-size:20px;font-weight:700;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:2px}
.balance-badge{
display:flex;align-items:center;gap:6px;
font-size:15px;font-weight:700;
color:var(--gold);
background:rgba(232,182,76,0.1);
border:1px solid rgba(232,182,76,0.25);
padding:7px 14px;border-radius:10px;
}
.tabs{
display:flex;max-width:860px;margin:0 auto;
padding:0 12px;
background:rgba(20,26,36,0.9);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-bottom:1px solid var(--line);
position:sticky;top:63px;z-index:49;
overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
flex-shrink:0;padding:14px 18px;
font-size:13px;font-weight:600;
color:var(--muted);cursor:pointer;
border-bottom:2px solid transparent;
background:transparent;border-top:none;border-left:none;border-right:none;
font-family:inherit;white-space:nowrap;
transition:all .2s;
}
.tab.active{color:var(--accent-2);border-bottom-color:var(--accent-2)}
.container{max-width:860px;margin:0 auto;padding:18px}
.page{display:none}
.page.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.big-card{
background:var(--card);
border:1px solid var(--line);
border-radius:16px;
padding:24px;
margin-bottom:14px;
}
.big-title{
font-size:22px;font-weight:700;
letter-spacing:-.4px;
margin-bottom:8px;
text-align:center;
}
.big-sub{
font-size:14px;color:var(--text-dim);
text-align:center;
margin-bottom:20px;
line-height:1.5;
}
.verify-icon{
font-size:72px;
text-align:center;
margin-bottom:16px;
}
.verify-info{
background:var(--bg-2);
border:1px solid var(--line);
border-radius:12px;
padding:14px;
margin-bottom:16px;
}
.info-row{
display:flex;justify-content:space-between;
align-items:center;
padding:10px 0;
font-size:14px;
}
.info-row:not(:last-child){border-bottom:1px solid var(--line)}
.info-lbl{color:var(--text-dim)}
.info-val{
font-weight:700;
color:var(--accent-2);
font-family:monospace;
letter-spacing:1px;
}
.info-val.gold{color:var(--gold)}
.info-val.green{color:var(--green)}
.progress-wrap{
text-align:center;
padding:30px 0;
}
.progress-circle{
width:130px;height:130px;
margin:0 auto 20px;
position:relative;
}
.progress-svg{
transform:rotate(-90deg);
}
.progress-bg{
stroke:var(--card-2);
}
.progress-fg{
stroke:var(--accent);
transition:stroke-dashoffset .3s linear;
}
.progress-pct{
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
font-size:24px;font-weight:800;
color:var(--accent-2);
}
.progress-status{
font-size:14px;color:var(--text-dim);
letter-spacing:.3px;
}
.btn{
width:100%;
background:var(--accent);
color:#fff;
border:none;
border-radius:12px;
padding:15px;
font-size:15px;
font-weight:700;
cursor:pointer;
font-family:inherit;
transition:all .15s;
letter-spacing:.2px;
}
.btn:active{opacity:.85;transform:scale(.98)}
.btn:disabled{background:var(--card-2);color:var(--muted);cursor:not-allowed;transform:none}
.btn.gold{background:var(--gold);color:#1a1408}
.btn.green{background:var(--green);color:#fff}
.field{margin-bottom:14px}
.field label{
display:block;
font-size:11px;font-weight:700;
color:var(--muted);
text-transform:uppercase;
letter-spacing:1.2px;
margin-bottom:8px;
}
.field input{
width:100%;
background:var(--bg);
border:1px solid var(--line-2);
border-radius:12px;
padding:14px 16px;
color:var(--text);
font-size:16px;
font-family:monospace;
letter-spacing:2px;
text-align:center;
font-weight:700;
transition:border-color .15s;
}
.field input:focus{outline:none;border-color:var(--accent)}
.field input::placeholder{color:var(--muted);font-weight:400;letter-spacing:1px}
.shop-item{
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
padding:16px;
margin-bottom:10px;
display:flex;
align-items:center;
gap:14px;
transition:border-color .2s;
}
.shop-item.legendary{
border-color:var(--gold);
background:linear-gradient(135deg,var(--card) 0%, rgba(232,182,76,0.05) 100%);
}
.shop-item.owned{
border-color:var(--green);
background:linear-gradient(135deg,var(--card) 0%, rgba(77,205,94,0.05) 100%);
}
.shop-item.active{
border-color:var(--accent);
background:linear-gradient(135deg,var(--card) 0%, rgba(77,143,214,0.08) 100%);
}
.shop-id{
font-family:monospace;
font-size:20px;
font-weight:800;
letter-spacing:2px;
color:var(--text);
flex:1;
min-width:0;
}
.shop-item.legendary .shop-id{color:var(--gold)}
.shop-price{
font-size:14px;
font-weight:700;
color:var(--gold);
white-space:nowrap;
}
.shop-btn{
background:var(--accent);
color:#fff;
border:none;
border-radius:10px;
padding:10px 16px;
font-size:13px;
font-weight:700;
cursor:pointer;
font-family:inherit;
white-space:nowrap;
flex-shrink:0;
}
.shop-btn:active{opacity:.85}
.shop-btn.buy{background:var(--accent)}
.shop-btn.owned-btn{background:var(--green)}
.shop-btn.active-btn{background:var(--gold);color:#1a1408}
.shop-btn:disabled{background:var(--card-2);color:var(--muted);cursor:not-allowed}
.toast{
position:fixed;
bottom:24px;left:50%;
transform:translateX(-50%) translateY(120%);
background:var(--card-2);
border:1px solid var(--line-2);
color:var(--text);
padding:14px 22px;
border-radius:12px;
font-size:14px;
font-weight:600;
z-index:99999;
opacity:0;
transition:all .25s;
pointer-events:none;
max-width:90vw;
text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{
text-align:center;
padding:60px 24px;
color:var(--muted);
}
.empty-box{
width:72px;height:72px;
margin:0 auto 18px;
border:2px solid var(--line);
border-radius:20px;
display:flex;align-items:center;justify-content:center;
font-size:28px;color:var(--muted);
background:var(--card);
}
.empty-title{font-size:16px;font-weight:700;color:var(--text-dim);margin-bottom:6px}
.empty-desc{font-size:13px}
.loading{
text-align:center;
padding:60px 20px;
color:var(--muted);
font-size:12px;font-weight:700;
letter-spacing:2px;
text-transform:uppercase;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="logo">Darkgram</div>
      <div class="logo-sub">verify</div>
    </div>
    <div class="balance-badge">💎 <span id="headerIrises">0</span></div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('verify', event)">🆔 Verify</button>
  <button class="tab" onclick="switchTab('promo', event)">🎫 Промокод</button>
  <button class="tab" onclick="switchTab('shop', event)">🛒 Магазин</button>
  <button class="tab" onclick="switchTab('profile', event)">👤 Профиль</button>
</div>

<div class="container">
  <div class="page active" id="page-verify">
    <div id="verifyContent"><div class="loading">Загрузка...</div></div>
  </div>
  <div class="page" id="page-promo">
    <div id="promoContent"><div class="loading">Загрузка...</div></div>
  </div>
  <div class="page" id="page-shop">
    <div id="shopContent"><div class="loading">Загрузка...</div></div>
  </div>
  <div class="page" id="page-profile">
    <div id="profileContent"><div class="loading">Загрузка...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const urlParams = new URLSearchParams(window.location.search);
const TG_USER_ID = urlParams.get('user_id') || tg?.initDataUnsafe?.user?.id || null;
const TG_FIRST_NAME = tg?.initDataUnsafe?.user?.first_name || 'Anonymous';

let userData = {
  irises: 0,
  ai_id: null,
  orcode: null,
  promo_code: null,
  promo_used: false,
  owned_ids: [],
  active_id: null,
  verified: false
};

let shopItems = [];
let verifyInProgress = false;
let verifyTimer = null;

async function api(url, opts = {}) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 15000);
    const r = await fetch(url, {
      headers: {'Content-Type':'application/json'},
      signal: c.signal,
      ...opts
    });
    clearTimeout(t);
    return await r.json();
  } catch (e) { return null; }
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateBalance() {
  const el = document.getElementById('headerIrises');
  if (el) el.textContent = userData.irises || 0;
}

function switchTab(name, event) {
  if (event) event.preventDefault();
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const tabs = ['verify','promo','shop','profile'];
  const idx = tabs.indexOf(name);
  const tabEls = document.querySelectorAll('.tab');
  if (idx >= 0 && tabEls[idx]) tabEls[idx].classList.add('active');
  const page = document.getElementById('page-' + name);
  if (page) page.classList.add('active');

  if (name === 'verify') loadVerify();
  if (name === 'promo') loadPromo();
  if (name === 'shop') loadShop();
  if (name === 'profile') loadProfile();
}

async function loadUserData() {
  if (!TG_USER_ID) return;
  const data = await api('/api/profile/' + TG_USER_ID);
  if (data && data.ok) {
    userData = data;
    updateBalance();
  }
}

function loadVerify() {
  const el = document.getElementById('verifyContent');
  if (!el) return;

  if (!TG_USER_ID) {
    el.innerHTML = '<div class="empty"><div class="empty-box">?</div><div class="empty-title">Открой из Telegram</div></div>';
    return;
  }

  if (verifyInProgress) {
    renderProgress();
    return;
  }

  if (userData.verified && userData.ai_id) {
    renderVerifyResult();
    return;
  }

  el.innerHTML = `
    <div class="big-card">
      <div class="verify-icon">🆔</div>
      <div class="big-title">Verify Your ID</div>
      <div class="big-sub">Получи свой уникальный ID, ORCODE и промокод</div>
      <button class="btn" onclick="startVerify()">Начать верификацию</button>
    </div>
  `;
}

function renderProgress() {
  const el = document.getElementById('verifyContent');
  if (!el) return;
  el.innerHTML = `
    <div class="big-card">
      <div class="progress-wrap">
        <div class="progress-circle">
          <svg class="progress-svg" width="130" height="130">
            <circle class="progress-bg" cx="65" cy="65" r="58" fill="none" stroke-width="8"/>
            <circle class="progress-fg" id="progressCircle" cx="65" cy="65" r="58" fill="none" stroke-width="8"
              stroke-dasharray="364" stroke-dashoffset="364"/>
          </svg>
          <div class="progress-pct" id="progressPct">0%</div>
        </div>
        <div class="progress-status" id="progressStatus">Инициализация...</div>
      </div>
    </div>
  `;
}

async function startVerify() {
  if (verifyInProgress) return;
  verifyInProgress = true;
  renderProgress();

  const totalMs = 60000;
  const startTime = Date.now();
  const statuses = [
    'Подключение к серверу...',
    'Генерация ORCODE...',
    'Создание ID...',
    'Проверка уникальности...',
    'Финальная валидация...',
    'Почти готово...'
  ];

  const circle = document.getElementById('progressCircle');
  const pctEl = document.getElementById('progressPct');
  const statusEl = document.getElementById('progressStatus');

  const apiPromise = api('/api/verify/start', {
    method: 'POST',
    body: JSON.stringify({ user_id: TG_USER_ID })
  });

  clearInterval(verifyTimer);
  verifyTimer = setInterval(() => {
    const elapsed = Date.now() - startTime;
    const pct = Math.min(99, Math.floor((elapsed / totalMs) * 100));
    if (pctEl) pctEl.textContent = pct + '%';
    if (circle) circle.setAttribute('stroke-dashoffset', String(364 - (364 * pct / 100)));
    if (statusEl) {
      const idx = Math.min(statuses.length - 1, Math.floor(pct / 18));
      statusEl.textContent = statuses[idx];
    }
  }, 100);

  const res = await apiPromise;

  setTimeout(() => {
    clearInterval(verifyTimer);
    if (pctEl) pctEl.textContent = '100%';
    if (circle) circle.setAttribute('stroke-dashoffset', '0');
    if (statusEl) statusEl.textContent = 'Готово!';

    if (res && res.ok) {
      userData.ai_id = res.ai_id;
      userData.orcode = res.orcode;
      userData.promo_code = res.promo_code;
      userData.promo_used = res.promo_used || false;
      userData.verified = true;
      verifyInProgress = false;
      setTimeout(() => {
        renderVerifyResult();
        showToast('Верификация пройдена!');
      }, 500);
    } else {
      verifyInProgress = false;
      showToast('Ошибка верификации');
      loadVerify();
    }
  }, Math.max(0, totalMs - (Date.now() - startTime)));
}

function renderVerifyResult() {
  const el = document.getElementById('verifyContent');
  if (!el) return;
  el.innerHTML = `
    <div class="big-card">
      <div class="verify-icon">✅</div>
      <div class="big-title">Verified</div>
      <div class="big-sub">Твои данные получены</div>

      <div class="verify-info">
        <div class="info-row">
          <span class="info-lbl">🆔 ID</span>
          <span class="info-val">${esc(userData.ai_id || '—')}</span>
        </div>
        <div class="info-row">
          <span class="info-lbl">🎫 ORCODE</span>
          <span class="info-val gold">${esc(userData.orcode || '—')}</span>
        </div>
        <div class="info-row">
          <span class="info-lbl">🔑 CODE</span>
          <span class="info-val green">${esc(userData.promo_code || '—')}</span>
        </div>
      </div>

      <div style="font-size:13px;color:var(--text-dim);text-align:center;margin-bottom:14px">
        ${userData.promo_used
          ? '✅ Промокод использован'
          : '⚠️ Введи этот код во вкладке «Промокод»'}
      </div>

      ${!userData.promo_used ? '<button class="btn gold" onclick="switchTab(\'promo\', event)">Ввести код</button>' : ''}
    </div>
  `;
}

function loadPromo() {
  const el = document.getElementById('promoContent');
  if (!el) return;

  if (!TG_USER_ID) {
    el.innerHTML = '<div class="empty"><div class="empty-box">?</div><div class="empty-title">Открой из Telegram</div></div>';
    return;
  }

  if (!userData.verified) {
    el.innerHTML = `
      <div class="big-card">
        <div class="verify-icon">🔒</div>
        <div class="big-title">Сначала верификация</div>
        <div class="big-sub">Пройди верификацию, чтобы получить код</div>
        <button class="btn" onclick="switchTab('verify', event)">Перейти к верификации</button>
      </div>
    `;
    return;
  }

  if (userData.promo_used) {
    el.innerHTML = `
      <div class="big-card">
        <div class="verify-icon">✅</div>
        <div class="big-title">Промокод использован</div>
        <div class="big-sub">Ты уже активировал свой промокод</div>
      </div>
    `;
    return;
  }

  el.innerHTML = `
    <div class="big-card">
      <div class="verify-icon">🎫</div>
      <div class="big-title">Активировать промокод</div>
      <div class="big-sub">Введи свой код и получи от 30 до 130 ирисок</div>

      <div class="field">
        <label>Промокод</label>
        <input type="text" id="promoInput" placeholder="0000" maxlength="4" inputmode="numeric">
      </div>

      <button class="btn green" onclick="activatePromo()">Активировать</button>
    </div>
  `;
}

async function activatePromo() {
  const input = document.getElementById('promoInput');
  if (!input) return;
  const code = input.value.trim();
  if (!code || code.length !== 4) {
    showToast('Введи 4-значный код');
    return;
  }
  const res = await api('/api/verify/promo', {
    method: 'POST',
    body: JSON.stringify({ user_id: TG_USER_ID, code: code })
  });
  if (res && res.ok) {
    showToast('+' + res.reward + ' ирисок!');
    userData.irises = res.irises;
    userData.promo_used = true;
    updateBalance();
    setTimeout(() => loadPromo(), 800);
  } else if (res && res.error === 'wrong_code') {
    showToast('Неверный код');
  } else if (res && res.error === 'already_used') {
    showToast('Уже использован');
    userData.promo_used = true;
    loadPromo();
  } else {
    showToast('Ошибка');
  }
}

async function loadShop() {
  const el = document.getElementById('shopContent');
  if (!el) return;

  if (!TG_USER_ID) {
    el.innerHTML = '<div class="empty"><div class="empty-box">?</div><div class="empty-title">Открой из Telegram</div></div>';
    return;
  }

  const items = await api('/api/shop');
  shopItems = Array.isArray(items) ? items : [];

  await loadUserData();

  if (!shopItems.length) {
    el.innerHTML = '<div class="empty"><div class="empty-box">🛒</div><div class="empty-title">Магазин пуст</div></div>';
    return;
  }

  let html = '<div class="big-card"><div class="big-title">🛒 Магазин ID</div><div class="big-sub">Купи себе уникальный ID</div></div>';

  shopItems.forEach(item => {
    const owned = (userData.owned_ids || []).includes(item.value);
    const active = userData.active_id === item.value;
    const cls = 'shop-item' + (item.legendary ? ' legendary' : '') +
                (active ? ' active' : (owned ? ' owned' : ''));

    let btn = '';
    if (active) {
      btn = '<button class="shop-btn active-btn" disabled>Активен</button>';
    } else if (owned) {
      btn = '<button class="shop-btn owned-btn" onclick="activateId(\'' + item.value + '\')">Активировать</button>';
    } else {
      btn = '<button class="shop-btn buy" onclick="buyId(\'' + item.id + '\')">Купить</button>';
    }

    html += '<div class="' + cls + '">' +
      '<div class="shop-id">' + esc(item.value) + '</div>' +
      '<div class="shop-price">' + item.price + ' 💎</div>' +
      btn +
    '</div>';
  });

  el.innerHTML = html;
}

async function buyId(itemId) {
  const res = await api('/api/shop/buy', {
    method: 'POST',
    body: JSON.stringify({ user_id: TG_USER_ID, item_id: itemId })
  });
  if (res && res.ok) {
    showToast('ID куплен!');
    userData.irises = res.irises;
    userData.active_id = res.active_id;
    userData.owned_ids = res.owned_ids;
    updateBalance();
    loadShop();
  } else if (res && res.error === 'not_enough') {
    showToast('Недостаточно ирисок');
  } else if (res && res.error === 'already_owned') {
    showToast('Уже куплен');
  } else {
    showToast('Ошибка');
  }
}

async function activateId(value) {
  const res = await api('/api/shop/activate', {
    method: 'POST',
    body: JSON.stringify({ user_id: TG_USER_ID, value: value })
  });
  if (res && res.ok) {
    showToast('ID активирован!');
    userData.active_id = value;
    loadShop();
  } else {
    showToast('Ошибка');
  }
}

async function loadProfile() {
  const el = document.getElementById('profileContent');
  if (!el) return;

  if (!TG_USER_ID) {
    el.innerHTML = '<div class="empty"><div class="empty-box">?</div><div class="empty-title">Открой из Telegram</div></div>';
    return;
  }

  await loadUserData();

  const displayId = userData.active_id || userData.ai_id || '—';

  el.innerHTML = `
    <div class="big-card">
      <div class="big-title">👤 ${esc(TG_FIRST_NAME)}</div>
      <div class="big-sub">Профиль</div>

      <div class="verify-info">
        <div class="info-row">
          <span class="info-lbl">🆔 Текущий ID</span>
          <span class="info-val">${esc(displayId)}</span>
        </div>
        <div class="info-row">
          <span class="info-lbl">🎫 ORCODE</span>
          <span class="info-val gold">${esc(userData.orcode || '—')}</span>
        </div>
        <div class="info-row">
          <span class="info-lbl">💎 Ириски</span>
          <span class="info-val green">${userData.irises || 0}</span>
        </div>
        <div class="info-row">
          <span class="info-lbl">✅ Верификация</span>
          <span class="info-val ${userData.verified ? 'green' : ''}">${userData.verified ? 'Пройдена' : 'Нет'}</span>
        </div>
      </div>
    </div>
  `;
}

async function init() {
  await loadUserData();
  loadVerify();
}

init();
</script>
</body>
</html>
